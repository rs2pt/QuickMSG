name: QuickMSG
options:
  bundleIdPrefix: com.rs2pt
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    PRODUCT_NAME: "$(TARGET_NAME)"

schemes:
  QuickMSG:
    build:
      targets:
        QuickMSG: all
    test:
      targets:
        - QuickMSGTests

targets:
  QuickMSG:
    type: application
    platform: macOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rs2pt.QuickMSG
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: PreviewExtension

  PreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - PreviewExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rs2pt.QuickMSG.PreviewExtension
        INFOPLIST_FILE: PreviewExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: PreviewExtension/PreviewExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO

  QuickMSGTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rs2pt.QuickMSG.Tests
